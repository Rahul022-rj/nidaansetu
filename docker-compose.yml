# Local full stack: docker compose up --build   then open http://localhost:8080
# Create the owner account:  docker compose exec api npm run create-admin -- --email you@example.com --name "Your Name"
# Demo data (wipes the DB):  docker compose exec -e NODE_ENV=development api npm run seed:dev
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/nidaansetu
      CLIENT_ORIGIN: http://localhost:8080
      PUBLIC_API_URL: http://localhost:8080
      # Browsers accept Secure cookies on http://localhost. Anywhere else: HTTPS + real secrets.
      COOKIE_SAMESITE: lax
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-compose-local-only-change-me-0000000000000}
      FILE_URL_SECRET: ${FILE_URL_SECRET:-compose-local-only-change-me-1111111111111}
      OTP_SECRET: ${OTP_SECRET:-compose-local-only-change-me-2222222222222}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      SMTP_HOST: ${SMTP_HOST:-}
    volumes:
      - reports:/app/server/storage

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongo-data:
  reports:
